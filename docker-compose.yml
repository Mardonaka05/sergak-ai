version: '3.9'

services:
  sergak-backend:
    build: ./backend
    container_name: sergak-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/models_pt:/app/models_pt
      - ./backend/snapshots:/app/snapshots
      - ./backend/sergak.db:/app/sergak.db
      - ./frontend:/app/../frontend:ro
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DB_URL=sqlite+aiosqlite:///./sergak.db
      - INFERENCE_MODE=fp16
    runtime: nvidia                # for Jetson GPU passthrough
    devices:
      - /dev/video0:/dev/video0    # optional USB cam
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: sergak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Optional: nginx reverse proxy with HTTPS
  # nginx:
  #   image: nginx:alpine
  #   container_name: sergak-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./frontend:/usr/share/nginx/html:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - sergak-backend

volumes:
  redis-data:
